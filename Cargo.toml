[package]
name = "unpin"
version = "0.1.0"
edition = "2024"
description = "Find duplicate visual pins in a Pinterest board"

[dependencies]
askama = "0.14"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
ctrlc = "3.5.2"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
indicatif = "0.18"
inquire = "0.9.4"
open = "5"
percent-encoding = "2.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rookie = "0.5.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
# zune-core 0.5.2 breaks zune-jpeg 0.5.15 by expanding its warning macro to
# no expression. Keep unlocked `cargo install --path .` builds on the compatible
# release until the upstream pair is fixed.
zune-core = "=0.5.1"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
