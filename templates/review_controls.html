<div class="decision-options" role="group" aria-label="Review decision">
  <button class="decision-primary" data-remove-smaller type="button"><span data-remove-smaller-label>Remove smaller copies</span><kbd>R</kbd></button>
  <button class="decision-button" data-decision-action="keep_all" type="button" aria-pressed="false"><span data-keep-label>Keep all</span><kbd>A</kbd></button>
  <details class="decision-more">
    <summary class="control">More</summary>
    <div class="decision-menu">
      <button data-decision-action="not_duplicate" type="button">Not duplicates</button>
      <button data-decision-action="later" type="button">Decide later</button>
      <button data-decision-action="" type="button">Clear decision</button>
    </div>
  </details>
</div>
<span data-decision-notice role="status"></span>
<button class="review-button" type="button" data-review-button aria-pressed="false">
  <span data-review-label>Mark reviewed</span><kbd>E</kbd>
</button>
<p class="decision-help">Both choices save and move to the next match. To pick copies yourself, tick Remove this copy and save.</p>
