<div class="decision-options" role="group" aria-label="Review decision">
  <button class="decision-button" data-decision-action="keep_all" type="button" aria-pressed="false">Keep all</button>
  <details class="decision-more">
    <summary class="control">More</summary>
    <div class="decision-menu">
      <button data-decision-action="not_duplicate" type="button">Not duplicates</button>
      <button data-decision-action="later" type="button">Decide later</button>
      <button data-decision-action="" type="button">Clear decision</button>
    </div>
  </details>
</div>
<span data-decision-notice role="status"></span>
<button class="review-button" type="button" data-review-button aria-pressed="false">
  <span data-review-label>Done</span><kbd>E</kbd>
</button>
