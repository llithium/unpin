<article class="pin-card">
    <a
        class="image-stage"
        href="{{ item.image_url }}"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open original image for pin {{ item.pin_id }}"
        ><img
            src="{{ item.image_url }}"
            alt="Pinterest pin {{ item.pin_id }}"
            width="{{ item.width }}"
            height="{{ item.height }}"
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
    /></a>
    <div class="card-body">
        <div class="card-top">
            <span class="badge {{ item.recommendation.css_class() }}"
                >{{ item.recommendation.label() }}</span
            >
            <span class="pin-id" title="Pin {{ item.pin_id }}"
                >Pin {{ item.pin_id }}</span
            >
        </div>
        <div class="item-details">
            <p class="dimensions">{{ item.width }} × {{ item.height }}</p>
            <span class="file-size">{{ self.human_bytes(item.byte_size) }}</span>
        </div>
        {% if show_boards %}{% match item.board %}{% when Some with (board) %}<span
            class="board"
            title="{{ board }}"
            >{{ board }}</span
        >{% when None %}{% endmatch %}{% endif %}
        <div class="actions">
            <a
                class="button primary"
                href="{{ item.pin_url }}"
                target="_blank"
                rel="noopener noreferrer"
                >Open pin</a
            >
            <a
                class="button secondary"
                href="{{ item.image_url }}"
                target="_blank"
                rel="noopener noreferrer"
                >Open image</a
            >
        </div>
    </div>
</article>
